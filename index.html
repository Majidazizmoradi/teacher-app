<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر کلاس</title>
<style>
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#f3f6f8;--card:#fff;--ink:#14212b;--mute:#667784;--line:#dbe3e8;--ac:#2f5bea;--acs:#e5ebfd;--g:#16805a;--gs:#d9f2e7;--b:#c23a3a;--bs:#fbe2e2;--n:#8a6400;--ns:#faeec6;--onac:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--card:#18232b;--ink:#e8eef2;--mute:#92a3af;--line:#2a3943;--ac:#7c9bff;--acs:#22305a;--g:#4cc796;--gs:#173a2e;--b:#ff8585;--bs:#442226;--n:#e8c15a;--ns:#3d3416;--onac:#0f171d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f171d;--card:#18232b;--ink:#e8eef2;--mute:#92a3af;--line:#2a3943;--ac:#7c9bff;--acs:#22305a;--g:#4cc796;--gs:#173a2e;--b:#ff8585;--bs:#442226;--n:#e8c15a;--ns:#3d3416;--onac:#0f171d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Vazirmatn,Tahoma,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;font-weight:800;margin:4px 0 12px}
h3{margin:0 0 4px;font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.top h1{flex:1;margin:0;text-align:center;font-size:19px}
.sub{text-align:center;color:var(--mute);margin:-6px 0 12px}
.big{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--ac);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:18px;font-weight:600}
.big small{color:var(--mute);font-size:13px;font-weight:400}
.big.d{border-inline-start-color:var(--n)}
.big.m{border-inline-start-color:var(--line)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar .d{flex:1;position:relative;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;font-weight:600}
.bar .d input{position:absolute;inset:0;opacity:0;width:100%}
.btn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.btn.dng{color:var(--b)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.chip.g{background:var(--gs);color:var(--g);border-color:transparent}
.chip.b{background:var(--bs);color:var(--b);border-color:transparent}
.chip.n{background:var(--ns);color:var(--n);border-color:transparent}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:right;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-start}
.p{font-size:12px;border-radius:999px;padding:1px 9px}
.p.g{background:var(--gs);color:var(--g)}.p.b{background:var(--bs);color:var(--b)}.p.n{background:var(--ns);color:var(--n)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
input[type=text],input[type=password],input[type=time],textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
textarea{min-height:90px}
.sec{margin:20px 0 8px;font-weight:800;color:var(--mute);font-size:14px}
.nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;padding:8px 0;font-weight:600;color:var(--mute);border-radius:10px}
.nav button.on{color:var(--ac);background:var(--acs)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sh{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.sh small{color:var(--mute)}
.ent{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ent i{font-style:normal;color:var(--mute);font-size:13px}
.x{color:var(--mute);font-size:20px;padding:0 8px}
.cnt{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.hd{font-weight:800;margin:14px 0 4px}
.tb{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:14px}
.tb th,.tb td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tb td:first-child,.tb th:first-child{text-align:right;position:sticky;right:0;background:var(--card)}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.br{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.bl{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;background:var(--line);border-radius:6px;height:14px;overflow:hidden;display:block}
.bt i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bt i.lo{background:var(--b)}
.br b{width:42px;text-align:left;font-weight:600}
summary{cursor:pointer;list-style:none;display:inline-block;margin-bottom:8px}
summary::-webkit-details-marker{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card input,.card select,.card textarea{margin-bottom:4px}
.lb{font-size:13px;color:var(--mute);margin:8px 0 2px}
.ta{min-height:64px}
.hdrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
details{margin-bottom:8px}
.p.i{background:var(--acs);color:var(--ac)}
.chip.i{background:var(--acs);color:var(--ac);border-color:transparent}
.icr{display:flex;gap:8px;margin-bottom:10px}
.ic{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-weight:600;font-size:14px;color:var(--ink)}
.ic.on{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.sub2{padding-inline-start:30px;background:var(--bg)}
.at{display:flex;gap:6px;flex:none}
.at button{border:1.5px solid var(--line);border-radius:10px;padding:5px 9px;font-weight:600;background:var(--card)}
.at .g{color:var(--g);border-color:var(--g)}.at .b{color:var(--b);border-color:var(--b)}.at .i{color:var(--ac);border-color:var(--ac)}
.at .g.on{background:var(--g);color:var(--onac)}.at .b.on{background:var(--b);color:var(--onac)}.at .i.on{background:var(--ac);color:var(--onac)}
.tb tr.td td{background:var(--acs)}
.fab{position:fixed;left:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--onac);font-weight:800;font-size:20px;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pk{display:flex;flex-direction:column;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:right;min-width:0}
.pk small{color:var(--mute);font-size:12px}
.pk b{font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk.act{border-color:var(--ac);background:var(--acs)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px 2px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ac);color:var(--onac)}
.cb{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--onac);flex:none}
.cb.on{background:var(--ac);border-color:var(--ac)}
.pks.p3{grid-template-columns:repeat(3,1fr)}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dpg b{font-size:12px;color:var(--mute);padding:4px 0}
.dpd{padding:9px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:15px}
.dpd.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.dpd.tod{border-color:var(--ac);font-weight:800}
</style>
</head>
<body>
<main id="app"></main>
<datalist id="tl"></datalist>
<div id="sheet"></div>
<nav class="nav" id="nav"></nav>
<button id="hb" class="fab" aria-label="راهنما" onclick="openHelp()">؟</button>
<script>
const K='daftar-class-v1';
const ACAD=[{l:'پرسش',k:'n'},{l:'امتحان کتبی',k:'n'},{l:'کنفرانس',k:'n'},{l:'کار کلاسی',k:'n'},{l:'تحقیق',k:'n'},{l:'مشارکت در کلاس',k:'g'}];
const DISC=[{l:'سروصدا کردن',k:'b'},{l:'منفی',k:'b'},{l:'مثبت',k:'g'},{l:'اخراج از کلاس',k:'b'},{l:'تشویقی',k:'g'}];
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const par=k=>new Date(k+'T12:00:00');
const fa=k=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(par(k));
const nf=n=>n.toLocaleString('fa-IR');
const pm=k=>+new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{month:'numeric'}).format(par(k));
const autoTerm=k=>{const m=pm(k);return m>=7&&m<=10?1:2};
const termOf=(e,d)=>e.tm||autoTerm(d);
const entsR=(s,d)=>ents(s,d).filter(e=>!rtm||termOf(e,d)===rtm);
const metaOf=c=>[['درس',c.sub],['دبیر',c.tch],['پایه',c.grade],['مدرسه',c.sch],['سال تحصیلی',c.yr],['امتحان پایانی',c.fin]].filter(a=>a[1]).map(a=>a[0]+': '+a[1]);
const info=c=>metaOf(c).map(esc).join('، ');
const fields=(p,c={})=>`<input type="text" id="${p}nm" value="${esc(c.name||'')}" placeholder="نام کلاس، مثلاً هفتم الف"><input type="text" id="${p}sub" value="${esc(c.sub||'')}" placeholder="نام درس، مثلاً ریاضی"><input type="text" id="${p}tch" list="tl" value="${esc(c.tch||'')}" placeholder="نام دبیر"><input type="text" id="${p}g" value="${esc(c.grade||'')}" placeholder="پایه، مثلاً هفتم"><input type="text" id="${p}sch" value="${esc(c.sch||'')}" placeholder="نام مدرسه"><input type="text" id="${p}yr" value="${esc(c.yr||'')}" placeholder="سال تحصیلی، مثلاً ۱۴۰۵-۱۴۰۶"><select id="${p}fin"><option value="غیرنهایی" ${c.fin!=='نهایی'?'selected':''}>امتحان پایانی: غیرنهایی</option><option value="نهایی" ${c.fin==='نهایی'?'selected':''}>امتحان پایانی: نهایی</option></select>`;
const rd=(p,id)=>$('#'+p+id).value.trim();
const f2=v=>v==null?'-':v.toLocaleString('fa-IR',{maximumFractionDigits:2});
const num=v=>{v=String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,\/]/g,'.');const x=parseFloat(v);return isNaN(x)?undefined:x};
const scv=()=>{const e=$('#sc');return e?num(e.value):undefined};
const sd=d=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'numeric',day:'numeric'}).format(par(d));
const fix=d=>{if(!d.acts||Array.isArray(d.acts))d.acts={a:ACAD.slice(),d:DISC.slice()};if(!d.v2){d.v2=1;if(!d.acts.a.some(a=>a.l==='امتحان پایانی'))d.acts.a.push({l:'امتحان پایانی',k:'n'})}if(!d.term)d.term=autoTerm(key(new Date()));d.books=d.books||[];d.plans=d.plans||[];d.teachers=d.teachers||[];d.theme=d.theme||'auto';d.defs=d.defs||{};d.sched=d.sched||[];d.notes=d.notes||[];d.rules=d.rules||{pts:{}};if(d.lock&&d.autolock===undefined)d.autolock=true;d.periods=d.periods||[];d.sched.forEach(w=>{if(w.mig)return;w.mig=1;let q=Math.round(num(w.per));if(!(q>=1&&q<=20))q=d.sched.filter(x=>x!==w&&x.day===w.day&&x.mig).length+1;w.per=q;if(w.from||w.to){const z=d.periods[q-1]=d.periods[q-1]||{from:'',to:''};if(!z.from&&!z.to){z.from=w.from||'';z.to=w.to||''}}});for(let i=0;i<d.periods.length;i++)if(!d.periods[i])d.periods[i]={from:'',to:''};const pk={};d.classes.forEach(c=>c.students.forEach(s=>{if(!s.pid){const k=(c.name||'')+'|'+(s.name||'');s.pid=pk[k]||(pk[k]=uid())}}));return d};
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.classes)return fix(d)}catch(e){}return fix({classes:[],logs:{}})}
function save(){try{localStorage.setItem(K,JSON.stringify(db));stOk=localStorage.getItem(K)!==null}catch(e){stOk=false}}
let db=load(),view='home',hist=[],cur=null,day=key(new Date()),sid=null,ss='d',rs=null,arm=null,mv=null,rm=0,rf='',rt='',rg='',lastRows=[],rtm=0,rsub='',ryr='',meta=[],ed=null,pe=null,bmsg='',blink=null,bcv='',bkv='کتاب',locked=false,smsg='',lmsg='',fsub='',acc='cls',accS='',adk='',ad={},amsg='',nid=null,nfil='',wd=null,rtxt='',rtsv='',attRows=[],xf=null,xs={},xmsg='',mtab=0,mtm=0,mdet=null,hopen='home',RF={sub:[],gr:[],cl:[],tm:[]},rtab=0,pk=null,rrules=0,mgt=0,plt=0,xa={},wp=null,pl={st:1,cl:1,gr:0,sc:0},rblob=null,dp=null,stOk=true;
const subs=()=>[...new Set(db.classes.map(c=>c.sub||'').filter(Boolean))];
const visCls=()=>db.classes.filter(c=>(!RF.sub.length||RF.sub.includes(c.sub||''))&&(!RF.gr.length||RF.gr.includes(c.grade||'')));
const cls=()=>{const L=visCls();let c=L.find(x=>x.id===cur);if(!c&&L[0]){c=L[0];cur=c.id}return c};
const MX=()=>db.mx||20;
const ents=(s,d=day)=>(db.logs[d]&&db.logs[d][s])||[];
const es=(s,sec)=>ents(s).filter(e=>(e.s||'d')===sec);
const pill=e=>`<span class="p ${e.k}">${esc(e.t)}${e.ab?' (غایب)':typeof e.sc==='number'?' ('+nf(e.sc)+')':''}</span>`;
const secNow=()=>view==='acad'?'a':'d';

function go(v){hist.push(view);view=v;arm=null;mv=null;smsg='';amsg='';render();window.scrollTo(0,0)}
function back(){view=hist.pop()||'home';arm=null;mv=null;smsg='';amsg='';render()}
function tab(v){hist=[];view=v;arm=null;mv=null;smsg='';amsg='';render();window.scrollTo(0,0)}
function enter(id){cur=id;go('class')}
function pick(id){cur=id;rs=null;mv=null;render()}
function move(n){const d=par(day);d.setDate(d.getDate()+n);day=key(d);render()}
function setTerm(t){db.term=t;save();render()}
function setDay(v){if(v){day=v;render()}}
function openS(id){sid=id;ss=secNow();render()}
function closeS(){sid=null;render()}
function addEnt(s,t,k,n,sc){db.logs[day]=db.logs[day]||{};const en={id:uid(),t,k,n:n||'',s:ss,tm:db.term};if(sc!==undefined)en.sc=sc;(db.logs[day][s]=db.logs[day][s]||[]).push(en);save()}
const scBad=()=>{const e=$('#sc');if(!e||!e.value.trim())return false;const v=num(e.value),bad=v===undefined||v<0||v>MX();e.style.borderColor=bad?'var(--b)':'';if(bad){e.value='';e.placeholder='نمره باید بین ۰ تا '+nf(MX())+' باشد'}return bad};
function quick(i){if(scBad())return;const a=db.acts[ss][i];addEnt(sid,a.l,a.k,$('#nt').value.trim(),scv());render()}
function custom(){const t=$('#cu').value.trim();if(!t||scBad())return;if(!db.acts[ss].some(a=>a.l===t))db.acts[ss].push({l:t,k:'n'});addEnt(sid,t,'n',$('#nt').value.trim(),scv());render()}
function delEnt(id){db.logs[day][sid]=ents(sid).filter(e=>e.id!==id);save();render()}
function addClass(){const v=rd('n','nm');if(!v)return;const c={id:uid(),name:v,grade:rd('n','g'),sub:rd('n','sub'),tch:rd('n','tch'),sch:rd('n','sch'),yr:rd('n','yr'),fin:$('#nfin').value,students:[]};db.classes.push(c);cur=c.id;save();render()}
function saveInfo(){const c=cls();if(!rd('e','nm'))return;Object.assign(c,{name:rd('e','nm'),grade:rd('e','g'),sub:rd('e','sub'),tch:rd('e','tch'),sch:rd('e','sch'),yr:rd('e','yr'),fin:$('#efin').value});genCodes(c);save();render()}
function addStudents(){const c=cls();const raw=$('#sn').value;const names=(/\n/.test(raw)?raw.split(/\r?\n/):raw.split(/[،,;؛]/)).map(x=>x.replace(/\t/g,' ').replace(/^[\s\d۰-۹٠-٩]+[.\-):،]*\s*/,'').replace(/\s+/g,' ').trim()).filter(Boolean);names.forEach(n=>c.students.push({id:uid(),pid:uid(),name:n}));genCodes(c);save();render()}
function two(k,fn){if(arm===k){arm=null;fn();save();render()}else{arm=k;render()}}
function purge(ids){Object.keys(db.logs).forEach(d=>{ids.forEach(i=>{delete db.logs[d][i]});if(!Object.keys(db.logs[d]).length)delete db.logs[d]})}
function delStudent(id){two('s'+id,()=>{const c=cls();c.students=c.students.filter(s=>s.id!==id);purge([id])})}
function delAllStu(){two('all',()=>{const c=cls();purge(c.students.map(s=>s.id));c.students=[]})}
function delClassHome(){if(arm==='c'){const c=cls();purge(c.students.map(s=>s.id));db.classes=db.classes.filter(x=>x.id!==c.id);cur=null;save();arm=null;hist=[];view='home';render()}else{arm='c';render()}}
function delClass(){two('c',()=>{const c=cls();purge(c.students.map(s=>s.id));db.classes=db.classes.filter(x=>x.id!==c.id);cur=null})}
function delAct(sec,i){two('a'+sec+i,()=>{db.acts[sec].splice(i,1)})}
function toggleMv(id){mv=mv===id?null:id;render()}
function moveStu(id,to){if(!to)return;const f=cls(),t=db.classes.find(c=>c.id===to),s=f.students.find(x=>x.id===id);if(!t||!s)return;f.students=f.students.filter(x=>x.id!==id);t.students.push(s);const pre=codePrefix(t);if(pre){let mx=0;t.students.forEach(x=>{if(x!==s&&x.code&&x.code.startsWith(pre)){const k=+x.code.slice(pre.length);if(k>mx)mx=k}});s.code=pre+String(mx+1).padStart(2,'0');allStu().forEach(x=>{if(x.s!==s&&s.pid&&x.s.pid===s.pid)x.s.code=s.code})}mv=null;save();render()}
function exportData(){$('#bk').value=JSON.stringify(Object.assign({},db,{lock:undefined}))}
function importData(){try{const d=JSON.parse($('#bk').value);if(d&&d.classes){const lk=db.lock;db=fix(d);db.lock=lk;cur=null;save();render()}}catch(e){$('#bk').value='متن پشتیبان معتبر نیست.'}}
function setRange(n){if(!n){rf='';rt=''}else{const t=new Date(),f=new Date();f.setDate(t.getDate()-n+1);rf=key(f);rt=key(t)}render()}
const inR=d=>(!rf||d>=rf)&&(!rt||d<=rt);

const exEntries=(c,id)=>{const r=[];c.students.forEach(s=>Object.keys(db.logs).forEach(d=>(db.logs[d][s.id]||[]).forEach(e=>{if(e.ex===id)r.push({d,s:s.id,e})})));return r};
function rmEx(c,id){exEntries(c,id).forEach(o=>{const a=db.logs[o.d]&&db.logs[o.d][o.s];if(!a)return;const k=a.filter(e=>e.ex!==id);if(k.length)db.logs[o.d][o.s]=k;else delete db.logs[o.d][o.s]});Object.keys(db.logs).forEach(d=>{if(!Object.keys(db.logs[d]).length)delete db.logs[d]})}
function exList(c){const m={};c.students.forEach(s=>Object.keys(db.logs).forEach(d=>(db.logs[d][s.id]||[]).forEach(e=>{if(e.ex){const o=m[e.ex]=m[e.ex]||{id:e.ex,d,t:e.t,tp:e.tp||'',v:[],ab:0};if(e.ab)o.ab++;else o.v.push(e.sc)}})));return Object.values(m).sort((a,b)=>a.d<b.d?1:-1)}

function saveExam(){const c=cls(),mx=MX(),vals=[],abs=[];let bad='';
  c.students.forEach(s=>{if(xa[s.id]){abs.push(s.id);return}const raw=(xs[s.id]||'').trim();if(!raw)return;const v=num(raw);if(v===undefined||v<0||v>mx)bad=s.name;else vals.push([s.id,v])});

  if(!vals.length&&!abs.length){xmsg='حداقل یک نمره یا یک غایب را ثبت کنید.';return render()}

const pts=l=>(db.rules&&db.rules.pts&&db.rules.pts[l])||0;
function ruleActs(){const ded=[],bon=[],seen={};const add=(l,k)=>{if(seen[l]||EXT.includes(l))return;seen[l]=1;(k==='b'?ded:bon).push(l)};add('غایب','b');add('تأخیر','b');db.acts.d.forEach(a=>add(a.l,a.k));db.acts.a.forEach(a=>add(a.l,a.k));add('حاضر','g');return{ded,bon}}
function mstOf(sid,tm){const sc=[],cnt={};
  Object.keys(db.logs).filter(inR).sort().forEach(d=>(db.logs[d][sid]||[]).forEach(e=>{if(tm&&termOf(e,d)!==tm)return;if(typeof e.sc==='number')sc.push({d,t:e.t,tp:e.tp,sc:e.sc});else if(!e.ab)cnt[e.t]=(cnt[e.t]||0)+1}));
  const avg=mean(sc.map(x=>x.sc));let adj=0;const eff=[];
  Object.keys(cnt).forEach(t=>{const p=pts(t);if(p){adj+=p*cnt[t];eff.push({t,n:cnt[t],v:p*cnt[t]})}});
  return{sc,avg,adj,eff,fin:avg==null?null:Math.min(MX(),Math.max(0,avg+adj))}}
function saveRules(){const o={};document.querySelectorAll('.rl').forEach(el=>{let v=num(el.value)||0;if(el.dataset.g==='d')v=-Math.abs(v);if(v)o[el.dataset.l]=v});db.rules={pts:o};save();smsg='قوانین ذخیره شد و در محاسبه نمره مستمر اعمال می‌شود.';render()}
function rulesHtml(){
